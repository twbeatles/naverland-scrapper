name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      NAVERLAND_SKIP_PLAYWRIGHT_BROWSER_CHECK: "1"
      NAVERLAND_SKIP_PLAYWRIGHT_TESTS: "1"
      NAVERLAND_UPDATE_PRIVATE_KEY_B64: ${{ secrets.NAVERLAND_UPDATE_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller
          python -m pytest -q tests/test_app_entry.py tests/test_main_paths.py tests/test_update_manifest.py
      - name: Build signed release
        shell: pwsh
        run: |
          if (-not $env:NAVERLAND_UPDATE_PRIVATE_KEY_B64) { throw "NAVERLAND_UPDATE_PRIVATE_KEY_B64 is required" }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $configured = (python -c "from src.utils.version import APP_VERSION; print(APP_VERSION.removeprefix('v'))").Trim()
          if ($version -notmatch '^\d+(\.\d+)*$' -or $version -ne $configured) { throw "Tag must match APP_VERSION" }
          if (-not (python -c "from src.utils.version import UPDATE_PUBLIC_KEY_B64; print(UPDATE_PUBLIC_KEY_B64)")) { throw "UPDATE_PUBLIC_KEY_B64 must be embedded before release" }
          $env:NAVERLAND_ONEFILE = "1"
          python -m PyInstaller --clean --noconfirm naverland-scrapper.spec
          $source = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $source) { throw "PyInstaller did not create an EXE" }
          $artifact = Join-Path $PWD "dist/naverland-scrapper-v$version.exe"
          Copy-Item -LiteralPath $source.FullName -Destination $artifact
          & $artifact --preflight
          if ($LASTEXITCODE -ne 0) { throw "Frozen preflight failed" }
          $url = "https://github.com/twbeatles/naverland-scrapper/releases/download/v$version/naverland-scrapper-v$version.exe"
          python scripts/build_update_manifest.py --version $version --artifact $artifact --artifact-url $url --output "$env:RUNNER_TEMP/latest.json"
          "ARTIFACT=$artifact" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ARTIFACT }}
            ${{ runner.temp }}/latest.json
      - name: Publish latest manifest
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tag must be contained in main" }
          git checkout -B main origin/main
          New-Item -ItemType Directory -Force updates | Out-Null
          Copy-Item "$env:RUNNER_TEMP/latest.json" updates/latest.json -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f updates/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "chore: publish update manifest for ${{ github.ref_name }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
